name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install native build libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev g++

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Rust's default lld linker does not search GCC's private lib directory.
      - name: Locate libstdc++
        run: echo "LIBRARY_PATH=$(dirname "$(gcc -print-file-name=libstdc++.so)")" >> "$GITHUB_ENV"

      - name: Test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
