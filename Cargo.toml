[package]
name = "cerebrumma"
version = "0.2.4"
edition = "2021"
authors = ["Medina Apps LLC <info@valethero.org>"]
description = "Portable, git-tracked memory and governance for AI agents"
license = "MIT OR Apache-2.0"

[[bin]]
name = "cerebrum"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_norway = "0.9"
anyhow = "1.0"
colored = "2.1"
dirs = "5.0"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tokio = { version = "1.0", features = ["full"] }
walkdir = "2.5"
rusqlite = { version = "0.41", features = ["bundled"] }
sqlite-vec = "0.1.0"
fastembed = "7"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "native-tls"] }
serde_json = "1.0"
md5 = "0.7"
reqwest = { version = "0.13", features = ["json"] }
sha2 = "0.10"
